name: Pain Point Analysis (Top 10)

on:
  schedule:
    # 每周一 UTC 03:00（抓取任务跑完后）自动提炼 Top 10
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      final_top_n:
        description: '最终输出痛点数量'
        required: false
        default: '10'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run analysis (heat scoring + DeepSeek review)
        run: npm run analyze
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          FINAL_TOP_N: ${{ github.event.inputs.final_top_n || '10' }}
          LLM_CANDIDATES: ${{ vars.LLM_CANDIDATES }}

      - name: Upload Top 10 result
        uses: actions/upload-artifact@v4
        with:
          name: top10-painpoints
          path: top10_painpoints.json
